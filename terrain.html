<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <meta name="description" content="BastCompta Terrain — devis rapides reliés à BastCompta.">
  <title>BastCompta Terrain</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="css/terrain.css?v=9">
  <script src="js/storage.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="terrain-shell">
    <section id="terrainLoading" class="screen screen-centered" aria-live="polite">
      <img src="logo.png" alt="BastCompta" class="brand-logo">
      <div class="loader" aria-hidden="true"></div>
      <p>Connexion à BastCompta…</p>
    </section>

    <section id="terrainAuth" class="screen screen-centered hidden">
      <div class="auth-panel">
        <div class="brand-block">
          <img src="logo.png" alt="BastCompta" class="brand-logo">
          <span class="terrain-badge">Terrain</span>
          <h1>Connexion</h1>
          <p>Utilise le même compte que dans BastCompta.</p>
        </div>
        <form id="terrainLoginForm" class="stack" novalidate>
          <label for="terrainEmail">Adresse mail</label>
          <input id="terrainEmail" type="email" autocomplete="email" inputmode="email" required>
          <label for="terrainPassword">Mot de passe</label>
          <input id="terrainPassword" type="password" autocomplete="current-password" required>
          <button id="terrainLoginBtn" class="primary-button" type="submit">Se connecter</button>
          <button id="terrainForgotBtn" class="text-button" type="button">Mot de passe oublié</button>
        </form>
        <p id="terrainAuthMessage" class="message" role="status" aria-live="polite"></p>
        <a class="back-link" href="index.html">Ouvrir BastCompta complet</a>
      </div>
    </section>

    <section id="terrainApp" class="screen hidden">
      <header class="mobile-header">
        <button id="backBtn" class="icon-button hidden" type="button" aria-label="Retour">←</button>
        <div class="header-copy">
          <span class="eyebrow">BastCompta Terrain</span>
          <h1 id="pageTitle">Accueil</h1>
        </div>
        <button id="terrainAccountBtn" class="icon-button" type="button" aria-label="Compte utilisateur">👤</button>
      </header>

      <div id="syncLine" class="sync-line"><span class="status-dot"></span><span id="syncText">Données locales BastCompta chargées</span></div>
      <div id="viewRoot" class="view-root"></div>
      <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

      <nav id="bottomNav" class="bottom-nav" aria-label="Navigation principale">
        <button type="button" data-nav="home"><span>⌂</span><small>Accueil</small></button>
        <button type="button" data-nav="clients"><span>👥</span><small>Clients</small></button>
        <button class="nav-create" type="button" data-nav="new-quote"><span>＋</span><small>Devis</small></button>
        <button type="button" data-nav="drafts"><span>📄</span><small>Brouillons</small></button>
        <button type="button" data-nav="prices"><span>🏷</span><small>Tarifs</small></button>
      </nav>

      <div id="terrainAccountMenu" class="account-sheet hidden" role="dialog" aria-modal="true" aria-labelledby="accountTitle">
        <button id="closeAccountBtn" class="sheet-backdrop" type="button" aria-label="Fermer"></button>
        <div class="sheet-panel">
          <div class="sheet-handle"></div>
          <h2 id="accountTitle">Mon compte</h2>
          <p id="terrainUserEmail"></p>
          <a class="sheet-link" href="index.html">Ouvrir BastCompta complet</a>
          <button id="connectDriveBtn" class="primary-button" type="button">Connecter Google Drive</button>
          <button id="syncDriveBtn" class="secondary-button" type="button">Synchroniser maintenant</button>
          <button id="reloadDataBtn" class="secondary-button" type="button">Recharger les données locales</button>
          <button id="terrainLogoutBtn" class="danger-button" type="button">Se déconnecter</button>
        </div>
      </div>
    </section>
  </main>


  <input id="terrainCameraInput" class="hidden-file-input" type="file" accept="image/*" capture="environment">
  <input id="terrainGalleryInput" class="hidden-file-input" type="file" accept="image/*" multiple>
  <script type="module" src="js/terrain.js?v=24"></script>
</body>
</html>
