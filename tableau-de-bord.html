<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tableau de bord · BastCompta</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="css/base.css?v=4">
  <link rel="stylesheet" href="css/tableau-de-bord.css?v=1">
  <script src="js/core/storage-keys.js"></script>
  <script src="js/modules/accounting/calculations.js"></script>
  <script src="js/modules/accounting/journals.js"></script>
  <script src="js/modules/accounting/fixed-assets.js"></script>
  <script src="js/modules/accounting/operating-ledger.js"></script>
  <script src="js/modules/accounting/vat-declaration.js"></script>
  <script src="js/modules/accounting/financial-statements.js"></script>
  <script src="js/modules/accounting/summary.js"></script>
  <script src="js/modules/clients/project-finance.js"></script>
  <script src="js/modules/personnel/calculations.js"></script>
</head>
<body>
  <main class="dashboard-shell">
    <header class="dashboard-heading">
      <div>
        <p class="eyebrow">Vue d’ensemble</p>
        <h1 id="welcomeTitle">Bonjour</h1>
        <p id="dashboardSubtitle">Voici l’essentiel de votre activité.</p>
      </div>
      <button class="refresh-button" id="refreshDashboard" type="button" title="Actualiser les données">↻ Actualiser</button>
    </header>

    <div class="dashboard-toolbar">
      <label for="dashboardYear">Période des indicateurs
        <select id="dashboardYear"></select>
      </label>
      <span class="access-summary" id="accessSummary"></span>
    </div>

    <section class="quick-actions" aria-label="Actions rapides">
      <button class="quick-action primary" data-tab="devis" data-page="quote" type="button"><span>＋</span>Nouveau devis</button>
      <button class="quick-action" data-tab="devis" data-page="invoice" type="button"><span>＋</span>Nouvelle facture</button>
      <button class="quick-action" data-tab="devis" data-page="tarifs" type="button"><span>▤</span>Mes tarifs</button>
      <button class="quick-action premium-action" data-tab="compta" data-page="purchases" data-pack="accounting" type="button"><span>＋</span>Ajouter un achat</button>
    </section>

    <section class="section-block" aria-labelledby="commercialTitle">
      <div class="section-title">
        <div><p class="eyebrow">Inclus gratuitement</p><h2 id="commercialTitle">Activité commerciale</h2></div>
        <button class="text-button" data-tab="devis" data-page="invoice" type="button">Ouvrir la gestion commerciale →</button>
      </div>
      <div class="metric-grid" id="commercialMetrics"></div>
    </section>

    <section class="section-block" aria-labelledby="accountingTitle">
      <div class="section-title">
        <div><p class="eyebrow">Pack Comptabilité</p><h2 id="accountingTitle">Situation comptable</h2></div>
        <button class="text-button accounting-link" data-tab="compta" data-page="dashboard" type="button">Ouvrir la comptabilité →</button>
      </div>
      <div class="metric-grid" id="accountingMetrics"></div>
    </section>

    <section class="section-block" aria-labelledby="clientsTitle">
      <div class="section-title">
        <div><p class="eyebrow">Pack Gestion d’activité</p><h2 id="clientsTitle">Clients et chantiers</h2></div>
        <button class="text-button client-link" data-tab="chantier" data-action="overview" type="button">Ouvrir le suivi client →</button>
      </div>
      <div class="metric-grid metric-grid-five" id="clientMetrics"></div>
    </section>

    <section class="section-block" aria-labelledby="personnelTitle">
      <div class="section-title">
        <div><p class="eyebrow">Pack Gestion d’activité</p><h2 id="personnelTitle">Personnel aujourd’hui</h2></div>
        <button class="text-button personnel-link" data-tab="personnel" data-page="summary" type="button">Ouvrir le personnel →</button>
      </div>
      <div class="metric-grid metric-grid-five personnel-metrics" id="personnelMetrics"></div>
    </section>

    <section class="bottom-grid">
      <article class="activity-card">
        <div class="section-title compact"><div><p class="eyebrow">À surveiller</p><h2>Priorités</h2></div></div>
        <div id="priorityList"></div>
      </article>
      <article class="activity-card">
        <div class="section-title compact"><div><p class="eyebrow">Données</p><h2>État de votre espace</h2></div></div>
        <div id="dataStatus"></div>
      </article>
    </section>
  </main>
  <script src="js/tableau-de-bord.js?v=1"></script>
</body>
</html>
