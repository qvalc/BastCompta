<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarifs</title>
  <link rel="stylesheet" href="css/tarifs.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>Tarifs</h1>
        <p>Bibliothèque personnelle de postes, prix et détails de composants.</p>
      </div>
      <div class="actions no-print">
        <button type="button" onclick="window.print()">Imprimer</button>
        <button type="button" id="exportCsvBtn">Exporter CSV</button>
        <button type="button" class="primary" id="exportBtn">Exporter JSON</button>
        <label class="file-label">Importer JSON<input type="file" id="importInput" accept="application/json" /></label>
      </div>
    </header>

    <main class="layout">
      <aside class="side-panel no-print">
        <details class="drawer" id="postsDrawer">
          <summary>Postes</summary>
          <div class="drawer-content">
            <button type="button" class="primary full" id="addBtn">+ Créer un poste</button>
            <div class="post-list" id="postList"></div>
          </div>
        </details>

        <details class="drawer" id="categoriesDrawer">
          <summary>Catégories</summary>
          <div class="drawer-content">
            <div class="category-add-row">
              <input id="newCategoryInput" type="text" placeholder="Nouvelle catégorie..." />
              <button type="button" id="addCategoryBtn">Ajouter</button>
            </div>
            <div class="managed-category-list" id="managedCategoryList"></div>
            <p class="small-hint">Tu peux gérer tes catégories ici. Supprimer une catégorie de cette liste ne supprime aucun poste.</p>
          </div>
        </details>
      </aside>

      <section class="main-panel">
        <div class="search-bar no-print">
          <div>
            <label for="searchInput">Rechercher un poste</label>
            <input id="searchInput" type="search" placeholder="Ex. bloc, nettoyage, haie, ciment..." />
          </div>
          <div>
            <label for="categoryFilter">Filtrer par catégorie</label>
            <select id="categoryFilter"></select>
          </div>
        </div>

        <div class="results no-print" id="searchResults"></div>
        <section id="tarifEditor"></section>
      </section>
    </main>
  </div>

  <template id="tarifTemplate">
    <article class="tarif-card">
      <div class="card-head">
        <div class="title-block">
          <input class="poste-input" data-field="poste" placeholder="Nom du poste / prestation" />
          <div class="meta-line">
            <span class="category-badge"></span>
            <span class="price-quick"></span>
            <span class="cost-quick"></span>
            <span class="margin-quick"></span>
          </div>
        </div>
        <div class="card-actions no-print">
          <button type="button" data-action="copyName">Copier</button>
          <button type="button" data-action="copyLine">Copier ligne devis</button>
          <button type="button" data-action="duplicate">Copier fiche</button>
          <button type="button" class="icon-delete" data-action="delete" title="Supprimer" aria-label="Supprimer">×</button>
        </div>
      </div>

      <div class="card-grid">
        <div>
          <label>Catégorie</label>
          <input data-field="categorie" list="categoriesList" placeholder="Nettoyage, Maçonnerie, Haie..." />
        </div>
        <div>
          <label>Unité / mesure</label>
          <input data-field="mesure" placeholder="m², ml, h, forfait..." />
        </div>
        <div>
          <label>Prix HTVA</label>
          <input class="number-input" data-field="prix" inputmode="decimal" placeholder="2.80" />
        </div>
        <div>
          <label>TVA %</label>
          <input class="number-input" data-field="tva" inputmode="decimal" placeholder="21" />
        </div>
        <div>
          <label>Prix TVAC</label>
          <input class="readonly-input" data-display="tvac" readonly />
        </div>
        <div>
          <label>Coût composants</label>
          <input class="readonly-input" data-display="cout" readonly />
        </div>
        <div>
          <label>Marge €</label>
          <input class="readonly-input" data-display="marge" readonly />
        </div>
        <div>
          <label>Marge %</label>
          <input class="readonly-input" data-display="margePct" readonly />
        </div>
      </div>

      <div class="details-grid">
        <div>
          <label>Mots-clés</label>
          <input data-field="tags" placeholder="bloc, ciment, karcher, terrasse, façade, mur..." />
        </div>
        <div>
          <label>Remarque</label>
          <textarea data-field="remarque" placeholder="Ex. prix pour accès facile, déchets non évacués..."></textarea>
        </div>
      </div>

      <details class="components" open>
        <summary>Détail coût de revient / composants</summary>
        <div class="component-table-wrap">
          <table class="component-table">
            <thead>
              <tr>
                <th>Élément</th>
                <th>Unité</th>
                <th>Quantité</th>
                <th>Prix unitaire</th>
                <th>Total</th>
                <th class="no-print">Action</th>
              </tr>
            </thead>
            <tbody data-components></tbody>
          </table>
        </div>
        <div class="component-actions no-print">
          <button type="button" data-action="addComponent">+ Ajouter un composant</button>
        </div>
      </details>

      <details class="advanced">
        <summary>Prix multiples, historique et photo</summary>
        <div class="advanced-grid">
          <div><label>Prix simple</label><input data-field="prixSimple" inputmode="decimal" placeholder="Ex. 2.80" /></div>
          <div><label>Prix moyen</label><input data-field="prixMoyen" inputmode="decimal" placeholder="Ex. 4.20" /></div>
          <div><label>Prix difficile</label><input data-field="prixDifficile" inputmode="decimal" placeholder="Ex. 6.50" /></div>
          <div><label>Historique des prix</label><textarea data-field="historique" placeholder="2025 : 2.45 €&#10;2026 : 2.80 €"></textarea></div>
          <div><label>Photo</label><input type="file" accept="image/*" data-action="image" /><button type="button" data-action="removeImage" class="icon-delete image-delete no-print" title="Retirer photo" aria-label="Retirer photo">×</button></div>
          <div class="photo-box"><img alt="Photo du poste" /></div>
        </div>
      </details>
    </article>
  </template>

  <datalist id="categoriesList"></datalist>
  <script src="js/tarifs.js"></script>
</body>
</html>
